<h1>Conway's Game of Life: Pulsar Oscillator</h1>
<canvas id="grid" width="500" height="500"></canvas>
<div class="controls">
    <button onclick="togglePlay()">Play/Pause</button>
    <button onclick="step()">Step</button>
    <button onclick="clearGrid()">Clear</button>
    <button onclick="loadPulsar()">Load Pulsar</button>
</div>
<div id="info">
    <p>Click on the grid to toggle cells on/off. Watch the pulsar pulse every 3 generations! Rules: Birth on 3 neighbors, survival on 2-3.</p>
</div>
