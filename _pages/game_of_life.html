---

title: "Conway's Game of Life"

---
<div class="game-of-life-container">
    <h1>Conway's Game of Life: Pulsar Oscillator</h1>
    <canvas id="grid" width="500" height="500"></canvas>
    <div class="controls">
        <button onclick="togglePlay()">Play/Pause</button>
        <button onclick="step()">Step</button>
        <button onclick="clearGrid()">Clear</button>
        <button onclick="loadPulsar()">Load Pulsar</button>
    </div>
    <div id="info">
        <p>Click on the grid to toggle cells on/off. Watch the pulsar pulse every 3 generations! Rules: Birth on 3 neighbors, survival on 2-3.</p>
    </div>

    <script>
        const canvas = document.getElementById('grid');
        const ctx = canvas.getContext('2d');
        const cellSize = 10;
        const cols = canvas.width / cellSize;
        const rows = canvas.height / cellSize;
        let grid = Array(rows).fill().map(() => Array(cols).fill(0));
        let playing = false;
        let animationId;

        // Draw the grid
        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    if (grid[y][x] === 1) {
                        ctx.fillStyle = '#00ff00';
                        ctx.fillRect(x * cellSize, y * cellSize, cellSize - 1, cellSize - 1); // -1 to avoid overlap
                    }
                    ctx.strokeStyle = '#333';
                    ctx.strokeRect(x * cellSize, y * cellSize, cellSize, cellSize);
                }
            }
        }

        // Count live neighbors
        function countNeighbors(y, x) {
            let count = 0;
            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    if (dy === 0 && dx === 0) continue;
                    const ny = (y + dy + rows) % rows;
                    const nx = (x + dx + cols) % cols;
                    count += grid[ny][nx];
                }
            }
            return count;
        }

        // Next generation
        function nextGeneration() {
            const newGrid = grid.map(row => [...row]);
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const neighbors = countNeighbors(y, x);
                    if (grid[y][x] === 1) {
                        if (neighbors < 2 || neighbors > 3) newGrid[y][x] = 0;
                    } else {
                        if (neighbors === 3) newGrid[y][x] = 1;
                    }
                }
            }
            grid = newGrid;
        }

        // Animation loop
        function animate() {
            if (playing) {
                nextGeneration();
                drawGrid();
                animationId = requestAnimationFrame(animate); // Use requestAnimationFrame for smoother animation
            }
        }

        // Toggle cell on click
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / cellSize);
            const y = Math.floor((e.clientY - rect.top) / cellSize);
            if (x >= 0 && x < cols && y >= 0 && y < rows) { // Boundary check
                grid[y][x] = 1 - grid[y][x];
                drawGrid();
            }
        });

        // Load Pulsar (full 15x15 pattern)
        function loadPulsar() {
            clearGrid();
            const centerY = Math.floor(rows / 2);
            const centerX = Math.floor(cols / 2);
            const pulsarOffsets = [
                [-5, -2], [-5, -1], [-5, 0], [-5, 1], [-5, 2],
                [-2, -5], [-2, 0], [-2, 5],
                [-1, -5], [-1, 0], [-1, 5],
                [0, -5], [0, -2], [0, -1], [0, 1], [0, 2], [0, 5],
                [1, -5], [1, 0], [1, 5],
                [2, -5], [2, 0], [2, 5],
                [5, -2], [5, -1], [5, 0], [5, 1], [5, 2]
            ];
            pulsarOffsets.forEach(([dy, dx]) => {
                const py = (centerY + dy + rows) % rows;
                const px = (centerX + dx + cols) % cols;
                grid[py][px] = 1;
            });
            drawGrid();
        }

        // Controls
        function togglePlay() {
            playing = !playing;
            if (playing) {
                animate();
            } else {
                cancelAnimationFrame(animationId);
            }
        }

        function step() {
            nextGeneration();
            drawGrid();
        }

        function clearGrid() {
            grid = Array(rows).fill().map(() => Array(cols).fill(0));
            drawGrid();
        }

        // Init
        window.addEventListener('load', () => {
            loadPulsar();
            drawGrid();
        });
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        canvas {
            border: 2px solid #333;
            background-color: #000;
            cursor: crosshair;
        }
        .controls {
            margin: 10px 0;
        }
        button {
            margin: 5px;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
        }
        #info {
            text-align: center;
            max-width: 600px;
        }
        .game-of-life-container {
            text-align: center;
        }
    </style>
</div>
